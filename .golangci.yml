---
version: "2"

run:
  timeout: 5m
  modules-download-mode: readonly

linters:
  default: standard
  enable:
    - bodyclose
    - errorlint
    - gocritic
    - gocyclo
    - gosec
    - misspell
    - prealloc
    - revive
  settings:
    errcheck:
      # Usage and error messages written to stdout/stderr are best-effort:
      # the server can do nothing useful if that write fails.
      exclude-functions:
        - fmt.Fprintf
        - fmt.Fprintln
    gocyclo:
      min-complexity: 15
    revive:
      severity: warning
  exclusions:
    rules:
      - path: '_test\.go'
        linters:
          - gocyclo
          - errcheck

formatters:
  enable:
    - gofumpt
    - gci
  settings:
    # gci groups the imports: standard library, third party, then this module.
    gci:
      sections:
        - standard
        - default
        - prefix(github.com/peczenyj/go-fizzbuzz)
