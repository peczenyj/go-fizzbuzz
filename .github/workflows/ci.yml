name: CI

on:
  push:
    branches: [main, devel]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9.3.0
        with:
          version: v2.12.2

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # The two Go releases currently supported upstream.
        go-version: ["1.26.x", "1.27.x"]
    name: test (go ${{ matrix.go-version }})
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-go@v7.0.0
        with:
          go-version: ${{ matrix.go-version }}

      - name: Vet
        run: go vet ./...

      - name: Test (race + coverage)
        run: go test -race -covermode=atomic -coverprofile=coverage.txt ./...

      # One iteration each: keeps the benchmarks compiling and running.
      # Numbers from shared runners are too noisy to compare.
      - name: Benchmarks (smoke)
        run: go test -run='^$' -bench=. -benchtime=1x ./...

      - name: Coverage summary
        run: go tool cover -func=coverage.txt | tail

      - name: Upload results to Codecov
        uses: codecov/codecov-action@v5
        if: matrix.go-version == '1.27.x'
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: peczenyj/go-fizzbuzz

  vulncheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-go@v7.0.0
        with:
          go-version: stable

      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Build image
        run: |
          docker build \
            --build-arg VERSION=${{ github.ref_name }} \
            --build-arg REVISION=${{ github.sha }} \
            --build-arg CREATED=$(date -u +%Y-%m-%dT%H:%M:%SZ) \
            -t go-fizzbuzz:ci .

      - name: Smoke test
        run: |
          docker run --rm go-fizzbuzz:ci -version | tee version.txt
          grep -q '^go-fizzbuzz ' version.txt
          docker run -d --name fizzbuzz -p 8080:8080 go-fizzbuzz:ci
          for i in $(seq 1 20); do
            curl -fsS localhost:8080/healthz && break
            sleep 0.5
          done
          curl -fsS "localhost:8080/fizzbuzz?int1=3&int2=5&limit=15&str1=fizz&str2=buzz" | tee body.json
          grep -q '"fizzbuzz"' body.json
          test "$(curl -s -o /dev/null -w '%{http_code}' 'localhost:8080/fizzbuzz?int1=0&int2=5&limit=15&str1=a&str2=b')" = "400"
          # one successful request so far; the invalid one must not count
          curl -fsS localhost:8080/statistics | tee stats.json
          grep -q '"params":{"int1":3,"int2":5,"limit":15,"str1":"fizz","str2":"buzz"},"hits":1' stats.json

      - name: Container logs
        if: always()
        run: docker logs fizzbuzz || true

  # Optional: publish to GHCR on version tags only.
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [docker, vulncheck]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Build and push
        env:
          IMAGE: ghcr.io/${{ github.repository }}
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker build \
            --build-arg VERSION=${{ github.ref_name }} \
            --build-arg REVISION=${{ github.sha }} \
            --build-arg CREATED=$(date -u +%Y-%m-%dT%H:%M:%SZ) \
            -t "$IMAGE:${{ github.ref_name }}" -t "$IMAGE:latest" .
          docker push --all-tags "$IMAGE"
